[project]
name = "opengates"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
    "openai>=2.28.0",
    "google-genai>=1.67.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.13.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.14"
files = ["opengates"]
explicit_package_bases = true
ignore_missing_imports = true
